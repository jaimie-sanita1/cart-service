$kind: http-example
request:
  url: "{{baseUrl}}/carts"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: text
    content: ""
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "INTERNAL_SERVER_ERROR",
        "message": "An unexpected error occurred"
      }
    $type: |-
      {
        "description": "Standard error response body returned for all error responses.",
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "example": "NOT_FOUND",
            "description": "A machine-readable error code identifying the error type."
          },
          "message": {
            "type": "string",
            "example": "Cart not found",
            "description": "A human-readable message describing the error."
          }
        }
      }
order: 2000
