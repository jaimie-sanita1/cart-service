$kind: http-example
request:
  url: "{{baseUrl}}/carts/:cartId/items/:itemId"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: cartId
      value: cart_abc123
      disabled: false
      description: The unique identifier of the cart.
    - key: itemId
      value: item_xyz789
      disabled: false
      description: The unique identifier of the cart item.
  body:
    type: text
    content: ""
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000
