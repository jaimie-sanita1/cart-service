$kind: http-request
description: Processes the checkout for a cart, creating an order from the cart contents. The cart must contain at least one item.
url: "{{baseUrl}}/carts/:cartId/checkout"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: cartId
    value: cart_abc123
    disabled: false
    description: The unique identifier of the cart.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Unique identifier for a cart.",
            "type": "string",
            "example": "cart_abc123"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
settings: {}
examples: ./.resources/Checkout a cart.resources/examples
order: 1000
