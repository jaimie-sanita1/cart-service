$kind: http-request
name: Add an item to a cart
description: ""
url: "{{baseUrl}}/carts/:cartId/items"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: cartId
    value: "{{cartId}}"
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "productId": "prod_001",
      "quantity": 2
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "productId": {
          "type": "string",
          "example": "prod_001"
        },
        "quantity": {
          "type": "integer",
          "minimum": 1,
          "example": 2
        }
      },
      "required": [
        "productId",
        "quantity"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      // save the `itemId` returned in the response as a collection variables
      var jsonData = pm.response.json();
      pm.collectionVariables.set("itemId", jsonData.id);
    language: text/javascript
settings: {}
examples: ./.resources/Add an item to a cart.resources/examples
order: 3000
