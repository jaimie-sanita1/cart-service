$kind: http-example
request:
  url: ://{{baseUrl}}/carts/:cartId/items/:itemId
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
      description: ""
    - key: Accept
      value: application/json
      description: ""
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    cartId: string
    itemId: string
  body:
    type: json
    content: |-
      {
        "quantity": 3
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "id": "item_xyz789",
        "productId": "prod_001",
        "name": "Wireless Headphones",
        "price": 29.99,
        "quantity": 2,
        "subtotal": 59.98
      }
    $type: |-
      {
        "description": "Represents a single product item within a cart.",
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "example": "item_xyz789",
            "description": "Unique identifier for the cart item."
          },
          "productId": {
            "type": "string",
            "example": "prod_001",
            "description": "The identifier of the product being purchased."
          },
          "name": {
            "type": "string",
            "example": "Wireless Headphones",
            "description": "Display name of the product."
          },
          "price": {
            "type": "number",
            "example": 29.99,
            "description": "Unit price of the product.",
            "format": "float"
          },
          "quantity": {
            "type": "integer",
            "example": 2,
            "description": "Number of units of this product in the cart."
          },
          "subtotal": {
            "type": "number",
            "example": 59.98,
            "description": "Total price for this line item (price × quantity).",
            "format": "float"
          }
        }
      }
order: 1000
