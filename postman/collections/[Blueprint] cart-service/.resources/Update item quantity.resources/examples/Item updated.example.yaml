$kind: http-example
request:
  url: "{{baseUrl}}/carts/:cartId/items/:itemId"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    cartId: string
    itemId: string
  body:
    type: json
    content: |-
      {
        "quantity": 3
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "item_xyz789",
        "productId": "prod_001",
        "name": "Wireless Headphones",
        "price": 29.99,
        "quantity": 2,
        "subtotal": 59.98
      }
order: 1000
