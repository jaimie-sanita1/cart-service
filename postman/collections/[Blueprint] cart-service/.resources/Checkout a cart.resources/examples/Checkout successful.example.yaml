$kind: http-example
request:
  url: ://{{baseUrl}}/carts/:cartId/checkout
  method: POST
  headers:
    - key: Accept
      value: application/json
      description: ""
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    cartId: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "id": "order_def456",
        "cartId": "cart_abc123",
        "items": [
          {
            "id": "item_xyz789",
            "productId": "prod_001",
            "name": "Wireless Headphones",
            "price": 29.99,
            "quantity": 2,
            "subtotal": 59.98
          },
          {
            "id": "item_xyz789",
            "productId": "prod_001",
            "name": "Wireless Headphones",
            "price": 29.99,
            "quantity": 2,
            "subtotal": 59.98
          }
        ],
        "total": 59.97,
        "status": "confirmed",
        "createdAt": "2004-10-31T14:38:07.844Z"
      }
    $type: |-
      {
        "description": "Represents a confirmed order created from a cart checkout.",
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "example": "order_def456",
            "description": "Unique identifier for the order."
          },
          "cartId": {
            "type": "string",
            "example": "cart_abc123",
            "description": "The identifier of the cart this order was created from."
          },
          "items": {
            "type": "array",
            "description": "List of items included in the order.",
            "items": {
              "description": "Represents a single product item within a cart.",
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "example": "item_xyz789",
                  "description": "Unique identifier for the cart item."
                },
                "productId": {
                  "type": "string",
                  "example": "prod_001",
                  "description": "The identifier of the product being purchased."
                },
                "name": {
                  "type": "string",
                  "example": "Wireless Headphones",
                  "description": "Display name of the product."
                },
                "price": {
                  "type": "number",
                  "example": 29.99,
                  "description": "Unit price of the product.",
                  "format": "float"
                },
                "quantity": {
                  "type": "integer",
                  "example": 2,
                  "description": "Number of units of this product in the cart."
                },
                "subtotal": {
                  "type": "number",
                  "example": 59.98,
                  "description": "Total price for this line item (price × quantity).",
                  "format": "float"
                }
              }
            }
          },
          "total": {
            "type": "number",
            "example": 59.97,
            "description": "Total price of the order.",
            "format": "float"
          },
          "status": {
            "type": "string",
            "enum": [
              "confirmed",
              "processing",
              "shipped",
              "delivered"
            ],
            "example": "confirmed",
            "description": "Current fulfillment status of the order."
          },
          "createdAt": {
            "type": "string",
            "description": "ISO 8601 timestamp when the order was created.",
            "format": "date-time"
          }
        }
      }
order: 1000
