$kind: collection
description: |-
  A simple e-commerce cart API for managing carts, items, and checkout.

  Contact Support:
   Name: API Owner
   Email: test@footlocker.com
variables:
  baseUrl: https://js-cart-service.postmansolutions.com
  itemId: ""
  cartId: ""
scripts:
  - type: http:afterResponse
    code: |-
      pm.test("Response time is less than 800ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(800);
      });
    language: text/javascript
auth:
  - id: 4094118b-ef28-4a30-8369-316ac10a22b9
    type: bearer
    name: bearer auth
    credentials:
      token: "{{bearerToken}}"
