$kind: http-example
request:
  url: ://{{baseUrl}}/carts/:cartId
  method: DELETE
  headers:
    - key: Accept
      value: application/json
      description: ""
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    cartId: string
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "code": "NOT_FOUND",
        "message": "Cart not found"
      }
    $type: |-
      {
        "description": "Standard error response body returned for all error responses.",
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "example": "NOT_FOUND",
            "description": "A machine-readable error code identifying the error type."
          },
          "message": {
            "type": "string",
            "example": "Cart not found",
            "description": "A human-readable message describing the error."
          }
        }
      }
order: 2000
