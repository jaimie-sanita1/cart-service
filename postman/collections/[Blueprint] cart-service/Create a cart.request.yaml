$kind: http-request
name: Create a cart
description: ""
url: "{{baseUrl}}/carts"
method: POST
headers:
  Accept: application/json
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      // save the `cartId` returned in the response as a collection variables
      var jsonData = pm.response.json();
      pm.collectionVariables.set("cartId", jsonData.id);
    language: text/javascript
settings: {}
examples: ./.resources/Create a cart.resources/examples
order: 1000
