$kind: http-request
name: Update item quantity
description: ""
url: "{{baseUrl}}/carts/:cartId/items/:itemId"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: cartId
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: itemId
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "quantity": 3
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "quantity": {
          "type": "integer",
          "minimum": 1,
          "example": 3
        }
      },
      "required": [
        "quantity"
      ]
    }
scripts:
