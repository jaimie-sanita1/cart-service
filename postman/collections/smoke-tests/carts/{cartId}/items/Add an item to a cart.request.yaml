$kind: http-request
name: Add an item to a cart
description: ""
url: "{{baseUrl}}/carts/:cartId/items"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: cartId
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "productId": "prod_001",
      "quantity": 2
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "productId": {
          "type": "string",
          "example": "prod_001"
        },
        "quantity": {
          "type": "integer",
          "minimum": 1,
          "example": 2
        }
      },
      "required": [
        "productId",
        "quantity"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response time is less than 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
settings: {}
examples: ./.resources/Add an item to a cart.resources/examples
order: 1000
