openapi: 3.0.3
info:
  title: Cart API
  description: A simple e-commerce cart API for managing carts, items, and checkout.
  version: 1.0.0
  contact:
    name: API Owner
    email: test@footlocker.com
security:
  - bearerAuth: []

servers:
  - url: https://js-cart-service.postmansolutions.com
    description: Mock Server

# TODO: Add /products endpoints in a future iteration to support product browsing and search.

paths:
  /carts:
    post:
      summary: Create a cart
      operationId: createCart
      responses:
        '201':
          description: Cart created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /carts/{cartId}:
    get:
      summary: Get a cart
      operationId: getCart
      parameters:
        - $ref: '#/components/parameters/cartId'
      responses:
        '200':
          description: Cart retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a cart
      operationId: deleteCart
      parameters:
        - $ref: '#/components/parameters/cartId'
      responses:
        '204':
          description: Cart deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /carts/{cartId}/items:
    post:
      summary: Add an item to a cart
      operationId: addItem
      parameters:
        - $ref: '#/components/parameters/cartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /carts/{cartId}/items/{itemId}:
    patch:
      summary: Update item quantity
      operationId: updateItemQuantity
      parameters:
        - $ref: '#/components/parameters/cartId'
        - $ref: '#/components/parameters/itemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Remove an item from a cart
      operationId: removeItem
      parameters:
        - $ref: '#/components/parameters/cartId'
        - $ref: '#/components/parameters/itemId'
      responses:
        '204':
          description: Item removed
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /carts/{cartId}/checkout:
    post:
      summary: Checkout a cart
      operationId: checkout
      parameters:
        - $ref: '#/components/parameters/cartId'
      responses:
        '200':
          description: Checkout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cart is empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /totals: {}
  /products:
    get:
      summary: Get all products
      responses:
        "200":
          description: "Products retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Products"
              examples:
                example1:
                  value:
                    - id: prod_001
                      name: Nike Air Max 90
                      price: 129.99
                      availability: in_stock
                    - id: prod_002
                      name: Adidas Samba OG
                      price: 100
                      availability: in_stock
                    - id: prod_003
                      name: New Balance 550
                      price: 109.99
                      availability: out_of_stock
        "500":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: listProducts
      description: Browse products available for purchase
      tags:
        - Products
      parameters:
        - name: param_1
          in: query
          schema:
            type: string
          required: false

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional bearer token (not enforced by cart-service)

  parameters:
    cartId:
      name: cartId
      in: path
      required: true
      schema:
        type: string
    itemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Cart:
      type: object
      properties:
        id:
          type: string
          example: cart_abc123
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total:
          type: number
          format: float
          example: 59.97
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CartItem:
      type: object
      properties:
        id:
          type: string
          example: item_xyz789
        productId:
          type: string
          example: prod_001
        name:
          type: string
          example: Wireless Headphones
        price:
          type: number
          format: float
          example: 29.99
        quantity:
          type: integer
          example: 2
        subtotal:
          type: number
          format: float
          example: 59.98

    AddItemRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          example: prod_001
        quantity:
          type: integer
          minimum: 1
          example: 2

    UpdateItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 3

    Order:
      type: object
      properties:
        id:
          type: string
          example: order_def456
        cartId:
          type: string
          example: cart_abc123
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total:
          type: number
          format: float
          example: 59.97
        status:
          type: string
          enum:
            - confirmed
            - processing
            - shipped
            - delivered
          example: confirmed
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: Cart not found
    Products:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: string
          example: prod_001
        name:
          type: string
          example: Nike Air Max 90
        price:
          type: number
          format: float
          example: 129.99
        availability:
          type: string
          enum:
            - in_stock
            - out_of_stock
          example: in_stock
